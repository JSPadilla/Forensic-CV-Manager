name: Apply cross-platform portable patch v2

on:
  push:
    branches:
      - feature/macos-support

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/macos-support
          fetch-depth: 0

      - name: Patch app.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          anchor = 'from ui_modern import SplashScreen, PdfPreviewWindow, make_preview_temp_path, resource_path\n'
          if 'from platform_utils import open_path\n' not in s:
              s = s.replace(anchor, anchor + 'from platform_utils import open_path\n', 1)

          old = '''def application_dir() -> Path:\n    """Return the folder containing the executable or source files."""\n    if getattr(sys, "frozen", False):\n        return Path(sys.executable).resolve().parent\n    return Path(__file__).resolve().parent\n'''
          new = '''def application_dir() -> Path:\n    """Return the portable application root on Windows, macOS, or Linux."""\n    portable_root = os.environ.get("FCV_PORTABLE_ROOT")\n    if portable_root:\n        return Path(portable_root).expanduser().resolve()\n\n    if getattr(sys, "frozen", False):\n        executable = Path(sys.executable).resolve()\n        if sys.platform == "darwin":\n            for parent in executable.parents:\n                if parent.suffix.lower() == ".app":\n                    return parent.parent\n        return executable.parent\n\n    return Path(__file__).resolve().parent\n'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''    def open_resume_folder(self):\n        path = str(portable_resume_dir())\n        if sys.platform.startswith("win"):\n            os.startfile(path)\n        else:\n            os.system(f'xdg-open "{path}" >/dev/null 2>&1 &')\n\n    def open_data_folder(self):\n        path = str(portable_data_dir())\n        if sys.platform.startswith("win"):\n            os.startfile(path)\n        else:\n            os.system(f'xdg-open "{path}" >/dev/null 2>&1 &')\n'''
          new = '''    def open_resume_folder(self):\n        try:\n            open_path(portable_resume_dir())\n        except Exception as exc:\n            messagebox.showerror("Open Folder", f"Unable to open the Resume folder.\\n\\n{exc}", parent=self)\n\n    def open_data_folder(self):\n        try:\n            open_path(portable_data_dir())\n        except Exception as exc:\n            messagebox.showerror("Open Folder", f"Unable to open the data folder.\\n\\n{exc}", parent=self)\n'''
          if old in s:
              s = s.replace(old, new, 1)

          required = [
              'from platform_utils import open_path',
              'FCV_PORTABLE_ROOT',
              'open_path(portable_resume_dir())',
              'open_path(portable_data_dir())',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Missing expected patch markers: {missing}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py platform_utils.py
          rm -rf __pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Add cross-platform portable path handling"
          git push origin HEAD:feature/macos-support
